[project]
name = "qtcloud-write"
version = "0.1.0-alpha.1"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "openai", "pydantic", "pydantic-settings"]

[tool.uv.workspace]
members = ["provider"]

[dependency-groups]
dev = ["httpx", "pytest"]

[tool.pytest.ini_options]
testpaths = ["src/provider/tests", "tests"]
pythonpath = ["src/provider"]
