[project]
name = "qtcloud-write"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn"]

[tool.uv.workspace]
members = ["provider"]

[dependency-groups]
dev = ["httpx", "pytest"]

[tool.pytest.ini_options]
testpaths = ["src/provider/tests", "tests"]
pythonpath = ["src/provider"]
